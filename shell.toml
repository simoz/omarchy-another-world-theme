# Another World — opaque midnight surfaces and restrained phosphor-green focus.
# Personal layout and font settings remain machine-level.
[bar]
background = "#142b3e"
background-alpha = 1.0
text = "#c5d8dc"
active = "#9cce6a"

[hyprland]
active-border = "#9cce6a"
